<title>Tanha Tabassum — Portfolio</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@600;800&family=Poppins:wght@400;600;800&display=swap">
<style>/* Tanha Tabassum portfolio — styles */
:root{--bg:#fff5fb;--card:#fff;--tx:#2b1838;--mut:#7b6689;--a:#e04ba0;--b:#7c4dff;--bd:#efdcec;--ff:'Inter',system-ui,sans-serif;--fs:16px;--ts:1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=ocean]{--a:#0ea5e9;--b:#4f46e5}
:root[data-theme=forest]{--a:#10b981;--b:#0d9488}
:root[data-mode=dark]{--bg:#150d1f;--card:#211431;--tx:#f6eafc;--mut:#b9a3c9;--bd:#35214a;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-mode=light]){--bg:#150d1f;--card:#211431;--tx:#f6eafc;--mut:#b9a3c9;--bd:#35214a;color-scheme:dark}}
*{box-sizing:border-box}html{font-size:var(--fs);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);transition:background .3s}
h1,h2,h3,h4{margin:0}p{line-height:1.6;font-size:calc(1rem*var(--ts));white-space:pre-line;margin:.4em 0}
.mut,small{color:var(--mut)}a{color:inherit}
.view{display:none;min-height:100vh}.view.on{display:block;animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.2rem 5rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}
.links{display:flex;gap:.3rem;flex:1;justify-content:flex-end;flex-wrap:wrap}
.links a{padding:.4rem .8rem;border-radius:99px;cursor:pointer;font-size:.9rem;transition:.2s}.links a:hover,.links a.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.badge{font-size:.7rem;padding:.2rem .6rem;border-radius:99px;background:var(--b);color:#fff}
.btn{border:0;border-radius:99px;padding:.8rem 1.5rem;font:inherit;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));text-decoration:none;display:inline-block;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--b) 40%,transparent)}
.btn.sm{padding:.4rem .9rem;font-size:.85rem}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.danger{background:#d93a4f}
.poster{position:relative;min-height:100vh;display:flex;align-items:flex-end;background:linear-gradient(160deg,var(--b),var(--a)) center/cover;overflow:hidden}
.poster .mono{position:absolute;inset:0;display:grid;place-items:center;font-size:42vw;font-weight:800;color:#ffffff30}
.bgl{position:absolute;inset:0;background-size:cover;background-position:var(--bx,50%) var(--by,50%);filter:blur(var(--bb,0px)) brightness(var(--bn,1));transform:scale(calc(var(--bz,1) * 1.08))}
.shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,var(--sh,.65)),transparent 65%)}
.pc{position:relative;padding:8vw 6vw;color:#fff;animation:up 1.1s .2s both}
.pc h1{font-size:clamp(3rem,13vw,8rem);line-height:.92;letter-spacing:-.03em;text-transform:uppercase;margin:.15em 0 .3em}
.pc h1 span{display:block;font-weight:600;font-size:.45em;opacity:.9}
.kick{letter-spacing:.25em;text-transform:uppercase;font-size:.8rem;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1.2rem;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px color-mix(in srgb,var(--b) 18%,transparent)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:1rem 0}
.hero{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.ph{width:min(260px,70vw);aspect-ratio:4/5;border-radius:1.5rem;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font-size:5rem;font-weight:800;box-shadow:0 20px 50px color-mix(in srgb,var(--b) 35%,transparent)}
.dc{cursor:pointer;text-align:left;font:inherit;color:inherit}
.ic{width:3rem;height:3rem;border-radius:1rem;display:grid;place-items:center;font-size:1.5rem;margin-bottom:.7rem;background:hsl(var(--h) 85% 90%)}
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#0008;padding:1rem}
#modal.on{display:grid}
#box{background:var(--bg);width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:1.4rem;padding:1.3rem;animation:up .35s both}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.item{border:1px solid var(--bd);background:var(--card);border-radius:1rem;padding:1rem;margin:.7rem 0}
.item img{width:100%;max-height:220px;object-fit:cover;border-radius:.7rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
label{display:block;font-size:.85rem;margin:.8rem 0 .25rem;color:var(--mut)}
input,textarea,select{width:100%;padding:.65rem .8rem;border-radius:.7rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
input[type=range]{padding:0}input[type=color]{height:2.4rem;padding:.15rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}.seg button{flex:1}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:9}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0}.acc h3{margin:0}.acc span{color:var(--mut);font-size:.8rem}
h2{font-size:1.8rem}h3{margin-bottom:.4rem}
.login{max-width:420px;margin:0 auto;padding:15vh 1.2rem 3rem}
</style>
</head>

const photo=()=>{const p=App.S.p;return p.photo?`<img class="ph" alt="${esc(p.name)}" src="${esc(p.photo)}">`:`<div class="ph">${esc(ini())}</div>`};
const view=()=>['landing','profile','dashboard','settings'].find(v=>v===location.hash.slice(1))||'landing';
const V={
landing(){const p=App.S.p,w=p.name.split(' ');return `<div class="poster">${p.photo?`<div class="bgl" style="background-image:url('${esc(p.photo)}')"></div>`:`<div class="mono">${esc(ini())}</div>`}<div class="shade"></div><div class="pc"><div class="kick">${esc(p.tag)}</div><h1>${esc(w[0])}<span>${esc(w.slice(1).join(' '))}</span></h1><button class="btn" data-go="profile">Explore My Portfolio →</button></div></div>`},
profile(){const p=App.S.p;return `<div class="wrap"><div class="hero">${photo()}<div style="flex:1;min-width:220px"><div class="kick mut">About Me</div><h2>${esc(p.name)}</h2><p class="mut">${esc(p.tag)}</p><button class="btn" data-go="dashboard">Open Dashboard →</button></div></div><div class="grid"><div class="card"><small>Full Name</small><h3>${esc(p.name)}</h3></div><div class="card"><small>University</small><h3>${esc(p.uni)}</h3></div><div class="card"><small>Department</small><h3>${esc(p.dept)}</h3></div></div><div class="card"><h3>Short Introduction</h3><p>${esc(p.intro)}</p></div></div>`},
dashboard(){return `<div class="wrap"><h2>Dashboard</h2><p class="mut">Tap a card to explore.</p><div class="grid">${SECS.map(([k,i,t,d],n)=>`<button class="card dc" data-sec="${k}"><div class="ic" style="--h:${n*50+300}">${i}</div><h3>${t}</h3><small>${d}</small><p class="mut" style="margin:.5rem 0 0">${App.S.s[k].length} item${App.S.s[k].length==1?'':'s'}</p></button>`).join('')}</div></div>`},
settings(){const T=App.T,o=(a,b)=>a===b?'selected':'',open=App.AO.app;return `<div class="wrap"><h2>Settings</h2><div class="card" style="margin:1rem 0"><button class="acc" data-acc="app"><h3>Appearance</h3><span>${open?'▲':'▼'}</span></button><div ${open?'':'hidden'}><label>Theme</label><div class="seg">${[['rose','Rose & Purple'],['ocean','Ocean'],['forest','Forest']].map(([k,l])=>`<button class="btn sm ${T.theme==k?'':'ghost'}" data-set="theme" data-val="${k}">${l}</button>`).join('')}</div><label>Mode</label><div class="seg">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="btn sm ${T.mode==k?'':'ghost'}" data-set="mode" data-val="${k}">${l}</button>`).join('')}</div><label>Font style</label><select data-in="font">${['Inter','Poppins','Playfair Display','Georgia','monospace'].map(f=>`<option ${o(f,T.font)}>${f}</option>`).join('')}</select><label>Font size (whole interface): ${T.fs}px</label><input type="range" min="13" max="22" value="${T.fs}" data-in="fs"><label>Text size (paragraphs): ${T.ts}%</label><input type="range" min="80" max="150" value="${T.ts}" data-in="ts"><label>Background colour</label><div class="row"><input type="color" style="width:5rem" value="${T.bg||'#fff5fb'}" data-in="bg"><button class="btn sm ghost" data-set="bg" data-val="">Reset</button></div><p class="mut"><small>Saved on this device only.</small></p></div></div>${App.admin?Admin.settingsHTML():''}</div>`}};
function render(keep){const y=scrollY,v=view();apply();const nav=v==='landing'?'':`<nav><a class="logo" data-go="profile">${esc(ini())}</a><div class="links">${[['profile','About'],['dashboard','Dashboard'],['settings','Settings']].map(([k,l])=>`<a data-go="${k}" class="${v==k?'on':''}">${l}</a>`).join('')}</div>${App.admin?'<span class="badge">Admin</span>':''}</nav>`;
$('#app').innerHTML=nav+`<div class="view on">${V[v]()}</div>`+(App.admin&&App.dirty?'<button class="btn fab" data-act="export">Download data.js</button>':'');scrollTo(0,keep?y:0)}
function modal(t,b){$('#mt').textContent=t;$('#mb').innerHTML=b;$('#modal').classList.add('on')}
const closeM=()=>$('#modal').classList.remove('on');
function openSec(k){const m=SECS.find(s=>s[0]==k);modal(m[1]+' '+m[2],(App.admin?`<button class="btn sm" data-add="${k}">+ Add item</button>`:'')+App.S.s[k].map((it,i)=>`<article class="item">${it.img?`<img alt="" src="${esc(it.img)}">`:''}<h4>${esc(it.t)}</h4><p>${esc(it.d)}</p><div class="row">${url(it.l)?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(url(it.l))}">Open link ↗</a>`:''}${App.admin?`<button class="btn sm ghost" data-edit="${k}:${i}">Edit</button><button class="btn sm danger" data-del="${k}:${i}">Delete</button>`:''}</div></article>`).join('')||'<p class="mut">Nothing here yet.</p>')}
document.addEventListener('click',e=>{if(e.target.id=='modal')return closeM();const t=e.target.closest('[data-go],[data-sec],[data-close],[data-set],[data-acc]');if(!t)return;const d=t.dataset;
if(d.close!==undefined)closeM();else if(d.go){location.hash=d.go;closeM()}else if(d.sec)openSec(d.sec);else if(d.acc){App.AO[d.acc]=!App.AO[d.acc];render(1)}else if(d.set!==undefined){App.T[d.set]=d.val;render(1)}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;App.T[k]=['fs','ts'].includes(k)?+e.target.value:e.target.value;apply();if(k=='fs'||k=='ts'){const l=e.target.previousElementSibling;l.textContent=l.textContent.replace(/: .*/,': '+App.T[k]+(k=='fs'?'px':'%'))}});
addEventListener('keydown',e=>e.key=='Escape'&&closeM());
addEventListener('hashchange',()=>render());
</script>
<script>render();
</script>
</body></html>
